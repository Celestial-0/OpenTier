syntax = "proto3";

package opentier.intelligence.v1;

// =============================================================================
// PROTO VERSIONING STRATEGY
// =============================================================================
//
// Version: 1.1.0 (2026-08)
//
// - REMOVED dead RPCs (no production caller ⇒ removed):
//     Chat.GetConversation / Chat.DeleteConversation   (API owns conversations)
//     ResourceService.ChunkedUpload                     (no HTTP exposure;
//      FileChunk / ChunkMetadata / ChunkedUploadResponse removed with it,
//      resolving the chunk_index comment/behavior contradiction)
//     ResourceService.CancelIngestion                   (no route)
//     ResourceService.SyncResourceMetadata              (stub that reported no
//      conflicts; Sync* messages/enums removed with it)
//     Health.Ready                                      (unused by gateway)
// - ADDED (additive): StreamErrorCode enum + StreamError message; populated in
//   ChatStreamChunk.typed_error alongside legacy string error field.
// - DOCUMENTED: ChatStreamChunk state machine + is_final semantics.
//
// VERSIONING RULES:
// 1. Package versioning: opentier.intelligence.v1, v2, etc. for breaking changes
// 2. Field numbering: Reserve 1-15 for frequently used fields (1-byte encoding)
// 3. Deprecation: Use [deprecated = true] annotation, maintain for 2 minor versions
// 4. Reserved fields: When removing fields inside a surviving message, mark them reserved
// 5. Backward compatibility: Only add optional fields, never remove required ones
//
// BREAKING CHANGE POLICY:
// - Major version bump (v1 → v2): Breaking changes allowed
// - Minor version: New messages/fields only; RPC removals require zero
//   production callers (verified) and are recorded in this changelog
// =============================================================================

// ============================================================================
// HEALTH SERVICE
// ============================================================================

service Health {
  // Liveness/basic reachability probe used by the gateway health endpoint.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  optional string version = 2;
  optional int64 uptime_seconds = 3; // Unix seconds since process start
}

// ============================================================================
// CHAT SERVICE
// ============================================================================

service Chat {
  // Send a message and get complete response.
  rpc SendMessage(ChatRequest) returns (ChatResponse);

  // Stream chat response in real-time.
  rpc StreamChat(ChatRequest) returns (stream ChatStreamChunk);

  // Generate conversation title using AI.
  rpc GenerateTitle(GenerateTitleRequest) returns (GenerateTitleResponse);
}

message ChatRequest {
  string user_id = 1;
  string conversation_id = 2;
  string message = 3;
  optional ChatConfig config = 4;
  map<string, string> metadata = 5;
}

message ChatConfig {
  optional float temperature = 1;
  optional int32 max_tokens = 2;
  optional bool use_rag = 3;
  optional string model = 4;
  optional int32 context_limit = 5;
}

message ChatResponse {
  string conversation_id = 1;
  string message_id = 2;
  string response = 3;
  repeated ContextChunk sources = 4;
  optional ChatMetrics metrics = 5;
  int64 created_at = 6; // Unix seconds
}

// Streaming state machine (per ChatStreamChunk):
//   1..N ContextChunk(source) events arrive FIRST (exactly one batch),
//   then 0..N token events,
//   then exactly one terminal event: metrics (success) or typed_error/error
//   (failure) with is_final = true.
// Consumers MUST treat is_final on the terminal event as stream completion;
// absence of tokens means an empty response, not a broken stream.
message ChatStreamChunk {
  string conversation_id = 1;
  string message_id = 2;
  oneof chunk_type {
    string token = 3;
    ContextChunk source = 4;
    ChatMetrics metrics = 5;
    string error = 6 [deprecated = true]; // Legacy "CODE: message" form.
    StreamError typed_error = 8;          // Preferred structured form.
  }
  bool is_final = 7;
}

enum StreamErrorCode {
  STREAM_ERROR_CODE_UNSPECIFIED = 0;
  STREAM_ERROR_CODE_INTERNAL_ERROR = 1;
  STREAM_ERROR_CODE_TIMEOUT = 2;
  STREAM_ERROR_CODE_RATE_LIMITED = 3;
  STREAM_ERROR_CODE_CONTEXT_TOO_LONG = 4;
  STREAM_ERROR_CODE_MODEL_UNAVAILABLE = 5;
  STREAM_ERROR_CODE_INVALID_REQUEST = 6;
  STREAM_ERROR_CODE_DEADLINE_EXCEEDED = 7;
}

message StreamError {
  StreamErrorCode code = 1;
  string message = 2;
}

message ChatMetrics {
  int32 tokens_used = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
  float latency_ms = 4; // Aligned with API f32
  int32 sources_retrieved = 5;
}

message ContextChunk {
  string chunk_id = 1;
  string document_id = 2;
  string content = 3;
  float relevance_score = 4;
  optional string document_title = 5;
  optional string source_url = 6;
  map<string, string> metadata = 7;
}

message GenerateTitleRequest {
  string conversation_id = 1;
  string user_message = 2;
  string assistant_message = 3;
}

message GenerateTitleResponse {
  string title = 1;
}

// ============================================================================
// RESOURCE SERVICE
// ============================================================================

service ResourceService {
  rpc AddResource(AddResourceRequest) returns (AddResourceResponse);
  rpc GetResourceStatus(GetResourceStatusRequest) returns (ResourceStatusResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
  rpc ReembedAll(ReembedAllRequest) returns (ReembedAllResponse);
}

message ReembedAllRequest {
  optional string model_slug = 1;
}

message ReembedAllResponse {
  int32 reembedded_chunks = 1;
  int32 dimensions = 2;
  string model_slug = 3;
  string status = 4;
}

message AddResourceRequest {
  string user_id = 1;
  string resource_id = 2;
  oneof content {
    string text = 3;
    string url = 4;
    bytes file_content = 5;
  }
  ResourceType type = 6;
  optional string title = 7;
  map<string, string> metadata = 8;
  optional IngestionConfig config = 9;
  bool is_global = 10;
}

message IngestionConfig {
  optional int32 chunk_size = 1;
  optional int32 chunk_overlap = 2;
  optional bool auto_clean = 3;
  optional bool generate_embeddings = 4;
  optional int32 max_depth = 5;
  optional bool follow_links = 6;
}

message AddResourceResponse {
  string job_id = 1;
  string resource_id = 2;
  ResourceStatus status = 3;
}

message GetResourceStatusRequest {
  string job_id = 1;
  string resource_id = 2;
  string user_id = 3;
}

message ResourceStatusResponse {
  string job_id = 1;
  string resource_id = 2;
  ResourceStatus status = 3;
  int32 chunks_created = 4;
  optional string error = 5;
  float progress = 6;
}

message ListResourcesRequest {
  string user_id = 1;
  optional int32 limit = 2;
  optional string cursor = 3;
  optional ResourceType type_filter = 4;
  optional ResourceStatus status_filter = 5;
}

message ListResourcesResponse {
  repeated ResourceItem items = 1;
  optional string next_cursor = 2;
  int32 total_count = 3;
}

message ResourceItem {
  string id = 1;
  ResourceType type = 2;
  string content = 3; // Short summary or snippet
  ResourceStatus status = 4;
  ResourceStats stats = 5;
  int64 created_at = 6; // Unix seconds
  map<string, string> metadata = 7;
  bool is_global = 8;
}

message ResourceStats {
  int32 documents = 1;
  int32 chunks = 2;
}

message DeleteResourceRequest {
  string user_id = 1;
  string resource_id = 2;
}

message DeleteResourceResponse {
  bool success = 1;
  string resource_id = 2;
}

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_TEXT = 1;
  RESOURCE_TYPE_MARKDOWN = 2;
  RESOURCE_TYPE_PDF = 3;
  RESOURCE_TYPE_HTML = 4;
  RESOURCE_TYPE_WEBSITE = 5;
  RESOURCE_TYPE_CODE = 6;
}

enum ResourceStatus {
  RESOURCE_STATUS_UNSPECIFIED = 0;
  RESOURCE_STATUS_QUEUED = 1;
  RESOURCE_STATUS_PROCESSING = 2;
  RESOURCE_STATUS_COMPLETED = 3;
  RESOURCE_STATUS_FAILED = 4;
  RESOURCE_STATUS_PARTIAL = 5;
}

// Internal Document message for processing pipeline
message Document {
  string id = 1;
  string title = 2;
  string content = 3;
  DocumentType type = 4;
  string source_url = 5;
  map<string, string> metadata = 6;
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_TEXT = 1;
  DOCUMENT_TYPE_MARKDOWN = 2;
  DOCUMENT_TYPE_HTML = 3;
  DOCUMENT_TYPE_PDF = 4;
  DOCUMENT_TYPE_CODE = 5;
}
