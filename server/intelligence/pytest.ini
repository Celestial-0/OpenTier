# Pytest configuration
# NOTE: keys use INI syntax under [pytest]; the previous [tool.pytest.ini_options]
# section header silently disabled every setting here.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short

# Logging during tests
log_cli = true
log_cli_level = INFO
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
