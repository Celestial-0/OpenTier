name: opentier
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opentier-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentier

  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${INTELLIGENCE_BASE_IMAGE:-pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime}
        UV_EXTRA_ARGS: ${INTELLIGENCE_UV_ARGS:-}
    container_name: opentier-intelligence
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── DB (overridden to use internal Docker network) ──────────────
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      # ── Runtime ─────────────────────────────────────────────────────
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GRPC_PORT: ${GRPC_PORT:-50051}

      # ── DB Pool ─────────────────────────────────────────────────────
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_ECHO: ${DB_ECHO:-false}

      # ── Ingestion ────────────────────────────────────────────────────
      INGESTION_CHUNK_SIZE: ${INGESTION_CHUNK_SIZE:-512}
      INGESTION_CHUNK_OVERLAP: ${INGESTION_CHUNK_OVERLAP:-50}
      INGESTION_MAX_BATCH_SIZE: ${INGESTION_MAX_BATCH_SIZE:-100}
      INGESTION_AUTO_CLEAN: ${INGESTION_AUTO_CLEAN:-true}
      INGESTION_GENERATE_EMBEDDINGS: ${INGESTION_GENERATE_EMBEDDINGS:-true}
      INGESTION_MAX_CONTENT_LENGTH: ${INGESTION_MAX_CONTENT_LENGTH:-1000000}
      INGESTION_CLEANING_STRATEGY: ${INGESTION_CLEANING_STRATEGY:-standard}

      # ── Embeddings ───────────────────────────────────────────────────
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}

      # ── Scraping ─────────────────────────────────────────────────────
      SCRAPING_TIMEOUT: ${SCRAPING_TIMEOUT:-30}
      SCRAPING_MAX_RETRIES: ${SCRAPING_MAX_RETRIES:-3}
      SCRAPING_USER_AGENT: ${SCRAPING_USER_AGENT:-OpenTier Intelligence Bot/1.0}

      # ── LLM ──────────────────────────────────────────────────────────
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-10000}

    expose:
      - "50051"
    restart: unless-stopped
    networks:
      - opentier

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      additional_contexts:
        - proto=./proto
        - db=./db
    container_name: opentier-api
    depends_on:
      db:
        condition: service_healthy
      intelligence:
        condition: service_started
    environment:
      # ── DB & networking (overridden to use internal Docker network) ──
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INTELLIGENCE_SERVICE_URL: http://intelligence:50051
      SERVER_HOST: 0.0.0.0

      # ── Server ───────────────────────────────────────────────────────
      SERVER_PORT: ${SERVER_PORT:-4000}
      RUST_LOG: ${RUST_LOG:-api=info,tower_http=info}

      # ── OAuth: Google ─────────────────────────────────────────────────
      GOOGLE_OAUTH_ENABLE: ${GOOGLE_OAUTH_ENABLE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}

      # ── OAuth: GitHub ─────────────────────────────────────────────────
      GITHUB_OAUTH_ENABLE: ${GITHUB_OAUTH_ENABLE:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL}

      # ── OAuth: Microsoft ──────────────────────────────────────────────
      MICROSOFT_OAUTH_ENABLE: ${MICROSOFT_OAUTH_ENABLE:-false}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_REDIRECT_URL: ${MICROSOFT_REDIRECT_URL}

      # ── OAuth: Discord ────────────────────────────────────────────────
      DISCORD_OAUTH_ENABLE: ${DISCORD_OAUTH_ENABLE:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL}

      # ── OAuth: X (Twitter) ────────────────────────────────────────────
      X_OAUTH_ENABLE: ${X_OAUTH_ENABLE:-false}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
      X_REDIRECT_URL: ${X_REDIRECT_URL}
      X_CONSUMEER_KEY: ${X_CONSUMEER_KEY}
      X_SECRET_KEY: ${X_SECRET_KEY}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN}

      # ── Email (SMTP) ──────────────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
      CONTACT_EMAIL: ${CONTACT_EMAIL}

      # ── Application URLs ──────────────────────────────────────────────
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}

      # ── Security & Session ────────────────────────────────────────────
      SESSION_EXPIRY_SECONDS: ${SESSION_EXPIRY_SECONDS:-2592000}
      VERIFICATION_TOKEN_EXPIRY_SECONDS: ${VERIFICATION_TOKEN_EXPIRY_SECONDS:-86400}
      PASSWORD_RESET_TOKEN_EXPIRY_SECONDS: ${PASSWORD_RESET_TOKEN_EXPIRY_SECONDS:-3600}

      # ── CORS ──────────────────────────────────────────────────────────
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # ── Rate Limiting ─────────────────────────────────────────────────
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

      # ── Usage Quota ───────────────────────────────────────────────────
      USAGE_LIMITS_ENABLED: ${USAGE_LIMITS_ENABLED:-true}

    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - opentier

volumes:
  postgres_data:

networks:
  opentier:
    driver: bridge
