name: opentier

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────
  database:
    image: postgres:18
    container_name: opentier-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - opentier-network

  # ── Redis (cache, locks, rate limits, event streams) ────────────────
  redis:
    image: redis:8-alpine
    container_name: opentier-redis
    # AOF for stream durability; noeviction so streams and
    # locks are never silently evicted under memory pressure
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - opentier-network

  # ── Qdrant (vector store of record) ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: opentier-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - opentier-network

  # ── Python Intelligence Engine (gRPC) ───────────────────────────────
  intelligence:
    image: ghcr.io/${IMAGE_REPO_OWNER:-celestial-0}/opentier-intelligence:${IMAGE_TAG:-latest}
    container_name: opentier-intelligence
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # ── Database (Internal Docker Network) ──────────────────────────
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

      # ── Redis & Qdrant (Internal Docker Network) ─────────────────────
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # ── Secrets Encryption (provider keys at rest) ───────────────────
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}

      # ── Runtime ─────────────────────────────────────────────────────
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GRPC_PORT: 50051
      PYTHONPATH: /app:/app/generated

      # ── DB Pool ─────────────────────────────────────────────────────
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_ECHO: ${DB_ECHO:-false}

      # ── Ingestion ────────────────────────────────────────────────────
      INGESTION_CHUNK_SIZE: ${INGESTION_CHUNK_SIZE:-512}
      INGESTION_CHUNK_OVERLAP: ${INGESTION_CHUNK_OVERLAP:-50}
      INGESTION_MAX_BATCH_SIZE: ${INGESTION_MAX_BATCH_SIZE:-100}
      INGESTION_AUTO_CLEAN: ${INGESTION_AUTO_CLEAN:-true}
      INGESTION_GENERATE_EMBEDDINGS: ${INGESTION_GENERATE_EMBEDDINGS:-true}
      INGESTION_MAX_CONTENT_LENGTH: ${INGESTION_MAX_CONTENT_LENGTH:-1000000}
      INGESTION_CLEANING_STRATEGY: ${INGESTION_CLEANING_STRATEGY:-standard}

      # ── Scraping ─────────────────────────────────────────────────────
      SCRAPING_TIMEOUT: ${SCRAPING_TIMEOUT:-30}
      SCRAPING_MAX_RETRIES: ${SCRAPING_MAX_RETRIES:-3}
      SCRAPING_USER_AGENT: ${SCRAPING_USER_AGENT:-OpenTier Intelligence Bot/1.0}

    expose:
      - "50051"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('127.0.0.1', 50051)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - opentier-network

  # ── Intelligence Workers (durable background consumers) ─────────────
  # Same image as `intelligence`; runs stream consumers instead of the gRPC
  # server so they scale and fail independently.
  worker:
    image: ghcr.io/${IMAGE_REPO_OWNER:-celestial-0}/opentier-intelligence:${IMAGE_TAG:-latest}
    container_name: opentier-worker
    command: ["uv", "run", "--no-dev", "worker.py"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app:/app/generated
    # Worker listens on no port; disable inherited TCP healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys; pids = [f for f in os.listdir('/proc') if f.isdigit()]; sys.exit(0 if any('worker.py' in open(f'/proc/{p}/cmdline', 'rb').read().decode('latin1', 'ignore') for p in pids if os.path.exists(f'/proc/{p}/cmdline')) else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - opentier-network

  # ── Rust API Gateway (HTTP) ─────────────────────────────────────────
  api:
    image: ghcr.io/${IMAGE_REPO_OWNER:-celestial-0}/opentier-api:${IMAGE_TAG:-latest}
    container_name: opentier-api
    depends_on:
      database:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Networking & DB (Internal Docker Network) ───────────────────
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      INTELLIGENCE_SERVICE_URL: http://intelligence:50051

      # ── Redis (Internal Docker Network) ─────────────────────────────
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # ── Secrets Encryption (provider keys at rest) ───────────────────
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}

      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      RUST_LOG: ${RUST_LOG:-api=info,tower_http=info}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

      # ── OAuth: Google ─────────────────────────────────────────────────
      GOOGLE_OAUTH_ENABLE: ${GOOGLE_OAUTH_ENABLE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}

      # ── OAuth: GitHub ─────────────────────────────────────────────────
      GITHUB_OAUTH_ENABLE: ${GITHUB_OAUTH_ENABLE:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}

      # ── OAuth: Microsoft ──────────────────────────────────────────────
      MICROSOFT_OAUTH_ENABLE: ${MICROSOFT_OAUTH_ENABLE:-false}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URL: ${MICROSOFT_REDIRECT_URL:-}

      # ── OAuth: Discord ────────────────────────────────────────────────
      DISCORD_OAUTH_ENABLE: ${DISCORD_OAUTH_ENABLE:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-}

      # ── OAuth: X (Twitter) ────────────────────────────────────
      X_OAUTH_ENABLE: ${X_OAUTH_ENABLE:-false}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_REDIRECT_URL: ${X_REDIRECT_URL:-}
                  
      # ── Email (SMTP) ──────────────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}

      # ── Application URLs ──────────────────────────────────────────────
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}

      # ── Security & Session ────────────────────────────────────────────
      SESSION_EXPIRY_SECONDS: ${SESSION_EXPIRY_SECONDS:-2592000}
      VERIFICATION_TOKEN_EXPIRY_SECONDS: ${VERIFICATION_TOKEN_EXPIRY_SECONDS:-86400}
      PASSWORD_RESET_TOKEN_EXPIRY_SECONDS: ${PASSWORD_RESET_TOKEN_EXPIRY_SECONDS:-3600}

      # ── CORS ──────────────────────────────────────────────────────────
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # ── Rate Limiting ─────────────────────────────────────────────────
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

      # ── Usage Quota ───────────────────────────────────────────────────
      USAGE_LIMITS_ENABLED: ${USAGE_LIMITS_ENABLED:-true}

      # ── Credit Billing ───────────────────────────────────────────────
      CREDITS_ENFORCED: ${CREDITS_ENFORCED:-true}
      CREDIT_RESERVE_ESTIMATE: ${CREDIT_RESERVE_ESTIMATE:-0.2}

    ports:
      - "${SERVER_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - opentier-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  opentier-network:
    driver: bridge
