name: opentier
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opentier-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentier

  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${INTELLIGENCE_BASE_IMAGE:-pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime}
        UV_EXTRA_ARGS: ${INTELLIGENCE_UV_ARGS:-}
    container_name: opentier-intelligence
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./intelligence/.env
    environment:
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    expose:
      - "50051"
    restart: unless-stopped
    networks:
      - opentier

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      additional_contexts:
        - proto=./proto
        - db=./db
    container_name: opentier-api
    depends_on:
      db:
        condition: service_healthy
      intelligence:
        condition: service_started
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INTELLIGENCE_SERVICE_URL: http://intelligence:50051
      SERVER_HOST: 0.0.0.0
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - opentier

volumes:
  postgres_data:

networks:
  opentier:
    driver: bridge
